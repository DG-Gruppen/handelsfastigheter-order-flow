name: Android-app

# Bygger Android-appen (Capacitor). Körs manuellt eller vid taggar android-v*, samt på
# pull requests som ändrar den native delen. Vanliga webbändringar från Lovable bygger inte appen.
on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "bun.lock"
      - "app-auth.html"
      - "src/app-auth/**"
      - "src/lib/native/**"
      - "src/components/NativeAppBridge.tsx"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Installera beroenden
        run: bun install --frozen-lockfile

      - name: Bygg webbappen
        run: bun run build

      - name: Synka till Android-projektet
        run: bunx cap sync android

      - name: Lägg in google-services.json (push-notiser)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.HAS_GOOGLE_SERVICES == 'true'
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Bygg debug-APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Bygg signerad release (AAB för Google Play)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.HAS_SIGNING_KEY == 'true'
        working-directory: android
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          ./gradlew bundleRelease --no-daemon
          rm -f "$ANDROID_KEYSTORE_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: shf-intra-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
