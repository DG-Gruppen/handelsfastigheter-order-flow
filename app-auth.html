<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="/favicon.png" type="image/png">
    <title>Logga in i SHF Intra-appen</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #2e4a63; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px; box-sizing: border-box; text-align: center;
      }
      main { max-width: 360px; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { margin: 0; opacity: .85; line-height: 1.45; }
      a.button {
        display: none; margin-top: 24px; padding: 12px 20px; border-radius: 10px;
        background: #fff; color: #2e4a63; font-weight: 600; text-decoration: none;
      }
      a.button.visible { display: inline-block; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon-192.png" alt="" />
      <h1 id="title">Loggar in…</h1>
      <p id="message">Du skickas vidare till Google.</p>
      <a id="open-app" class="button" href="#">Öppna SHF Intra-appen</a>
    </main>
    <script type="module" src="/src/app-auth/main.ts"></script>
  </body>
</html>
